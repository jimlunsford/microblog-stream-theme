  <text x="246" y="390" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Building things. Living life. Keeping my standards.</text>
  <text x="246" y="416" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Software, work, running, writing, and the rest of life.</text>

