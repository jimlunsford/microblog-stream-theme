<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="Microblog Stream 2.1.2 theme preview">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#020617"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111a2a"/>
      <stop offset="1" stop-color="#080e19"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="0.45" stop-color="#0b1220"/>
      <stop offset="0.7" stop-color="#3b2a21"/>
      <stop offset="1" stop-color="#f97316" stop-opacity=".44"/>
    </linearGradient>
    <linearGradient id="orangeLine" x1="0" x2="1">
      <stop offset="0" stop-color="#f97316" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="780" rx="38" fill="url(#bg)"/>

